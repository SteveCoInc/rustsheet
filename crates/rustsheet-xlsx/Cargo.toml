[package]
name = "rustsheet_xlsx"
description = "RustSheet xlsx import/export (forked from IronCalc's ironcalc crate)"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
thiserror = "1.0"
rustsheet_engine = { path = "../rustsheet-engine" }
itertools = "0.12"
chrono = "0.4"
bitcode = "0.6.8"
# OLE compound files (SPEC-0031 D1): pinned exactly, it parses untrusted containers.
cfb = "=0.16.0"
# ECMA-376 decryption (SPEC-0031 D2): RustCrypto primitives, pinned exactly, on the digest 0.10 /
# cipher 0.4 line that the `sha2` already in Cargo.lock uses, so no second digest stack is built.
aes = { version = "=0.8.4", default-features = false }
cbc = { version = "=0.1.2", default-features = false }
ecb = { version = "=0.1.2", default-features = false }
sha1 = { version = "=0.10.6", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }
subtle = { version = "=2.6.1", default-features = false }

[dev-dependencies]
rustsheet_engine = { path = "../rustsheet-engine", features = ["test-support"] }
uuid = { version = "1.2.2", features = ["serde", "v4"] }

[lib]
name = "rustsheet_xlsx"
path = "src/lib.rs"

[[bin]]
name = "test"
path = "src/bin/test.rs"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
large_stack_arrays = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"

[package]
name = "rustsheet_engine"
description = "RustSheet calculation engine core (forked from IronCalc's ironcalc_base)"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Seeded generators other crates' tests reuse (`rustsheet_engine::test_support`, T-4756): only a
# dev-dependency turns it on, so no release build carries them.
test-support = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
ryu = "1.0"
chrono = "0.4"
bitcode = "0.6.8"
csv = "1.3.0"
statrs = { version = "0.18.0", default-features = false, features = [] }
libm = "0.2.16"
thiserror = "1"
# memchr: one substring searcher per TEXTSPLIT delimiter; regex-automata:
# the REGEX* engine, a lazy DFA and PikeVM whose search work is counted (T-1272).
memchr = "2"
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "unicode", "hybrid", "nfa-pikevm"] }
# The `Hir` our PCRE2 parser builds for the automata, and its Unicode class and case-folding
# tables (SPEC-0013, T-1973; decision recorded with T-1973). One locked copy, shared with regex.
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode"] }

[dev-dependencies]
# float_roundtrip: the probe sidecars hold Excel doubles that must parse exactly (T-4142), as in rustsheet-eval.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# The PCRE2 tests compare our matcher with regex-automata's `meta` engine, which `regex` used to
# turn on for every build (T-2680 dropped `regex`).
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "unicode", "meta"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.69" }
wasm-bindgen = { version = "0.2" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.8.5"
chrono-tz = "0.10"



[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_stack_arrays = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"

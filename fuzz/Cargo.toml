[package]
name = "rustsheet-fuzz"
description = "cargo-fuzz targets for untrusted formulas and workbooks (T-0021)"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Its own workspace: the fuzz crate needs nightly + libFuzzer and must never be built by
# `make check`, and nothing in the engine may depend on it.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
# Public APIs only: the facade for evaluation and import, the engine's public parser module.
rustsheet = { path = "../crates/rustsheet" }
rustsheet_engine = { path = "../crates/rustsheet-engine" }
# Only for `encrypted_package`: decryption has no facade entry point until T-4266.
rustsheet_xlsx = { path = "../crates/rustsheet-xlsx" }
# Only for `cfb_seeds`, which writes `cfb_container`'s corpus; the same pin as rustsheet_xlsx.
cfb = "=0.16.0"
# Only for `pivot_import` and `pivot_seeds`, which rebuild a package around untrusted pivot parts;
# the same crate and features as rustsheet_xlsx.
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[bin]]
name = "formula_parse"
path = "fuzz_targets/formula_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formula_eval"
path = "fuzz_targets/formula_eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xlsx_import"
path = "fuzz_targets/xlsx_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bitcode_workbook"
path = "fuzz_targets/bitcode_workbook.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cfb_container"
path = "fuzz_targets/cfb_container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encrypted_package"
path = "fuzz_targets/encrypted_package.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pivot_import"
path = "fuzz_targets/pivot_import.rs"
test = false
doc = false
bench = false

# Not a fuzz target: writes `bitcode_workbook`'s seed corpus (run by seed_corpus.py).
[[bin]]
name = "bitcode_seeds"
path = "seeds/bitcode_seeds.rs"
test = false
doc = false
bench = false

# Not a fuzz target: writes `cfb_container`'s seed corpus (run by seed_corpus.py).
[[bin]]
name = "cfb_seeds"
path = "seeds/cfb_seeds.rs"
test = false
doc = false
bench = false

# Not a fuzz target: writes `pivot_import`'s seed corpus (run by seed_corpus.py).
[[bin]]
name = "pivot_seeds"
path = "seeds/pivot_seeds.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

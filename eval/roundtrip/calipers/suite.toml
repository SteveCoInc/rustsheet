name = "roundtrip-calipers"
description = "Round-trip fidelity (SPEC-0033) of Calipers' Excel goldens and the authored round-trip inputs, read from the calipers suite's fetched cache"
kind = "roundtrip"
# The calipers cell suite's fetched cache: fetched, skipped while not fetched, and gated as that suite is (T-4629).
cases_of = "calipers"
# Every Excel golden, and the authored `roundtrip/*/init.xlsx` inputs Excel's goldens were saved from.
include = ["**/golden.xlsx", "roundtrip/**/init.xlsx"]
# `_disabled/`: hostile files Calipers itself never loads.
exclude = ["_disabled/**"]
license = "MIT"
origin = "https://github.com/fundamental-research-labs/calipers (verification/cases)"
# R0, the standard edits together (SPEC-0033 D1, T-4514), and R2's sheet rename and delete (T-5005). Every
# scenario reruns every case, so the per-edit scenarios and R2's add and move run on the fixtures; `R1/all`
# measures the corpus with all six edits at once.
scenarios = ["R0", "R1/all", "R2/rename", "R2/delete"]
# Not in `make check`, as the calipers cell suite is not (its heavy workbooks and the time budget).
# `rustsheet-eval roundtrip --check --suite roundtrip-calipers` gates it; `make eval` reports it.
gate = false
baseline = "cases"
milestone = ["M15"]

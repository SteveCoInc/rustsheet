name = "roundtrip-corpus-bench"
description = "Round-trip fidelity (SPEC-0033) of the SpreadsheetBench input workbooks, read from the corpus-bench suite's fetched cache"
kind = "roundtrip"
# The corpus-bench cell suite's fetched cache: fetched, skipped while not fetched, and gated as that suite is (T-4629).
cases_of = "corpus-bench"
include = ["**/1_*_input.xlsx"]
license = "CC-BY-SA-4.0"
origin = "https://github.com/RUCKBReasoning/SpreadsheetBench"
# R0, the standard edits together (SPEC-0033 D1, T-4514), and R2's sheet rename and delete (T-5005). Every
# scenario reruns every case, so the per-edit scenarios and R2's add and move run on the fixtures; `R1/all`
# measures the corpus with all six edits at once.
scenarios = ["R0", "R1/all", "R2/rename", "R2/delete"]
# Gated like the cell suite: `make check` holds it wherever its cache is fetched (T-4629).
gate = true
baseline = "cases"
milestone = ["M15"]

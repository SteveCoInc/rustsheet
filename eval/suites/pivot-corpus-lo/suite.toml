name = "pivot-corpus-lo"
description = "LibreOffice's Excel-saved pivot workbooks (sc/qa/unit/data): import and formula cells scored against Excel's cached values; each pivot classified fresh or stale (T-4131)"
kind = "xlsx"
root = "../../.cache/suites/pivot-corpus-lo"
# The pivot-corpus (docs/research/pivot-tables-2026-11-04/plan.md, checks (a) and (b)) is two
# suites, one per fetched source, since a suite has one `[fetch]`: this one and
# pivot-corpus-closedxml. The pivot files of calipers, poi and corpus-bench are covered by
# reference: those suites' own runs classify their pivots too (report.md "Pivot freshness").
license = "MPL-2.0"
origin = "https://github.com/LibreOffice/core (sc/qa/unit/data)"
use_cached_values = true
# Only the files Excel saved (docProps Application Microsoft Excel or Excel Online) are evidence;
# the fetch list below is the Excel-saved ones of docs/research/pivot-tables-2026-11-04/oss-engines.md §5.
require_excel_authored = true
# Not in `make check` until the corpus is shown fast and stable in CI: `rustsheet-eval check --suite
# pivot-corpus-lo` gates it and `rustsheet-eval update-baseline --suite pivot-corpus-lo` ratchets it.
gate = false
baseline = "cells"
milestone = ["M16"]

[fetch]
url = "https://github.com/LibreOffice/core.git"
rev = "b1653ced6208ca71c4e0defd572fb43cb65050fc"
subdir = "sc/qa/unit/data"
# LibreOffice core is far too large to fetch whole: a blob-less fetch of the commit, then only the
# xlsx test files of these directories (about 9 MB).
sparse = [
  "sc/qa/unit/data/xlsx/*.xlsx",
  "sc/qa/unit/data/xlsx/pivot/*.xlsx",
  "sc/qa/unit/data/xlsx/pivot-table/*.xlsx",
]
# The Excel-saved workbooks with pivots, 64 files and 87 pivots (oss-engines.md §5).
include = [
  "xlsx/PivotTable_CachedDefinitionAndDataInSync.xlsx",
  "xlsx/PivotTable_CachedDefinitionAndDataNotInSync_SheetColumnsRemoved_WithCacheData.xlsx",
  "xlsx/PivotTable_CachedDefinitionAndDataNotInSync_SheetColumnsRemoved_WithoutCacheData.xlsx",

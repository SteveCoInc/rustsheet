name: Nightly eval

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-eval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - run: make eval
      # Decision 0323: the corpus round-trip gates (T-4173, T-4629), which the PR gate cannot fetch. The fetch is
      # its own step so a failed download fails the job instead of skipping a suite. Calipers' 1.4M-formula
      # workbooks take about 55 s of the default 60 s per case, hence the longer timeout.
      - run: target/release/rustsheet-eval fetch --suite calipers --suite poi --suite corpus-bench
      - run: >-
          target/release/rustsheet-eval roundtrip --check --timeout 300
          --suite roundtrip-calipers --suite roundtrip-poi --suite roundtrip-corpus-bench
      # The report is kept when a gate above fails, which is when it is needed.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-${{ github.run_id }}
          path: eval/runs/latest/

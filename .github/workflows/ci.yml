name: CI

on:
  pull_request:
  # Decision 0053: the merge queue tests each group merged with current main; every job runs.
  merge_group:
  # Only main, by literal name (scripts/test_check_ci_workflow.py): the merge train's branches
  # (decision 0147) were retired with the train (decision 0247, T-3827).
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Decision 0249: a push to main gets a group of its own (the sha), so a later merge never cancels
# its eval report; every other ref keeps one run, and a newer push cancels the older one.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Decision 0049: a PR that touches only docs skips the rust, eval and python jobs. A skipped job
  # reports success to required checks, so this job decides safely: anything it cannot
  # classify and every merge-queue group (decision 0053) runs everything.
  # Decision 0249: a push to main is the exact commit its merge group already tested, so `gates`
  # is 'false' there and only the eval report runs; a dispatch on main still runs every gate.
  # The rules live in scripts/ci_changes.py (tested by make hygiene); decision 0066 runs the copy
  # from the PR's base commit, so a PR cannot change how its own files are classified.
  # A PR diffs from the merge base of its base and head shas to its head; every other event runs
  # everything.
  changes:
    name: changes (docs-only?)
    runs-on: ubuntu-24.04
    outputs:
      # The heavy jobs run unless this is exactly 'false': a failed or skipped classification step
      # gives 'true', and a job that never ran leaves it empty.
      run_heavy: ${{ steps.diff.outcome == 'success' && steps.diff.outputs.code || 'true' }}
      gates: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          # from/to: ci_changes.py diffs the single merge base of the two to `to` (it requires
          # exactly one, and a full clone). src: the commit whose classifier runs (decision 0066).
          from='' to='' src=''
          if [ "$EVENT" = "pull_request" ]; then from=$BASE to=$PR_HEAD src=$BASE; fi
          # Every failure leaves code=true. A base whose classifier predates --merge-base reads
          # the empty stdin and says code=true.
          if [ -n "$from" ] && [ -n "$to" ] && [ -n "$src" ] \
            && git show "$src:scripts/ci_changes.py" > "$RUNNER_TEMP/ci_changes.py" \
            && out=$(python3 -I "$RUNNER_TEMP/ci_changes.py" --merge-base "$from" "$to" < /dev/null) \
            && [ "$out" = "code=false" ]; then
            code=false
          fi
          # File names are attacker-controlled: ci_changes.py logs only their count.
          echo "event=$EVENT code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Decisions 0122 and 0232: `make test` runs as three shards in parallel (the engine's unit tests
  # take most of the job). `make test-shard-1`, `-2` and `-3` together run exactly the tests
  # `make test` runs (see the Makefile); fmt and clippy run beside shard 1.
  rust:
    name: ${{ matrix.shard == 1 && 'rust (fmt, clippy, test 1/3)' || format('rust (test {0}/3)', matrix.shard) }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_heavy != 'false' && needs.changes.outputs.gates != 'false' }}
    runs-on: ubuntu-24.04
    strategy:
      # Each shard reports its own failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      # Shard 1 also caches clippy's artifacts; one key per shard keeps the shards from
      # overwriting each other's cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-shard-${{ matrix.shard }}
      - if: matrix.shard == 1
        run: make fmt-check
      - if: matrix.shard == 1
        run: make clippy
      - run: make test-shard-${{ matrix.shard }}

  # Decision 0122: one stable check name for every shard, so a required check (decision 0053's
  # list) never names a matrix job. A skipped matrix job reports under its unexpanded name
  # template, and a shard count change would rename the checks. always(), not !cancelled(): a
  # skipped required check counts as passed, so a cancelled run must report a failure here.
  rust-all:
    name: rust (fmt, clippy, test)
    needs: [changes, rust]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.rust.result }}
          RUN_HEAVY: ${{ needs.changes.outputs.run_heavy }}
          GATES: ${{ needs.changes.outputs.gates }}
        run: |
          echo "rust shards: $RESULT, run_heavy=$RUN_HEAVY, gates=$GATES"
          if [ "$RESULT" = "success" ]; then exit 0; fi
          # A docs-only PR (decision 0049) and a push to main (decision 0249) skip the shards on purpose.
          if [ "$RESULT" = "skipped" ] && { [ "$RUN_HEAVY" = "false" ] || [ "$GATES" = "false" ]; }; then exit 0; fi
          exit 1

  eval:
    name: eval (Excel-compatibility gate)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_heavy != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/new_case_owners.py diffs the branch against its merge base with origin/main (decision 0245).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      # Decision 0344 (SPEC-0035 D2): the fetched gate suites, poi and corpus-bench, gate here, read
      # from a cache keyed on their pins. No restore-keys: a partial match would restore another pin.
      - id: fetched-suites
        if: needs.changes.outputs.gates != 'false'
        uses: actions/cache@v4
        with:
          path: |
            eval/.cache/suites/poi
            eval/.cache/suites/corpus-bench
          key: fetched-suites-v1-${{ hashFiles('eval/suites/poi/suite.toml', 'eval/suites/corpus-bench/suite.toml') }}
      # On a miss, fetch them; three failures fail the job, never skip a gate (as nightly.yml's fetch).
      - if: needs.changes.outputs.gates != 'false' && steps.fetched-suites.outputs.cache-hit != 'true'
        run: |
          make build
          for attempt in 1 2 3; do
            scripts/eval_guard.sh target/release/rustsheet-eval fetch --suite poi --suite corpus-bench && exit 0
            sleep 30
          done
          exit 1
      # Decision 0125: one run of the suites judges both the baseline gate (eval-check) and the
      # evidence floor; running them as two steps rebuilt the release binary and reran the suites.
      # Decision 0249: not on a push to main, whose merge group already ran it.
      # Decision 0344: no make target fetches here (EVAL_FETCH empty), and a gate suite left unfetched
      # fails the run (--require-fetched, T-4725) instead of printing `skipping`.
      - if: needs.changes.outputs.gates != 'false'
        env:
          EVAL_FETCH: ""
          EVAL_GATE_FLAGS: --require-fetched
        run: make eval-gates
      # Decision 0243: the math sidecar check needs the release binary eval-gates built and tools/.
      - if: needs.changes.outputs.gates != 'false'
        uses: astral-sh/setup-uv@v6
      - if: needs.changes.outputs.gates != 'false'
        run: make eval-math-check
      # Decision 0054: the report reruns every suite (about 2.5 min). PRs, merge groups, merge trains
      # and dispatches on other branches only need it to debug a failed gate (decision 0147); main
      # keeps one per merge.
      - name: Full report (informational)
        if: ${{ failure() || github.ref == 'refs/heads/main' }}
        # It fetches nothing (decision 0344): it scores poi and corpus-bench from the job's cache.
        env:
          EVAL_FETCH: ""
        run: make eval
      - uses: actions/upload-artifact@v4
        if: ${{ failure() || github.ref == 'refs/heads/main' }}
        with:
          name: eval-report
          path: eval/runs/latest/
          if-no-files-found: ignore

  python:
    name: python (tools + bindings)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_heavy != 'false' && needs.changes.outputs.gates != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: make py-check
      - run: make py-bindings

  hygiene:
    name: hygiene (ratchets, deny, machete, typos, governance)
    # Decision 0249: not on a push to main (an empty output, from a failed `changes`, runs it).
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.gates != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,typos-cli
      - run: make hygiene
      - run: make deny
      - run: make machete
      - run: make typos
      - name: governance
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_governance.py origin/${{ github.base_ref }}
